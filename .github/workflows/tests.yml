name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (debug)
        run: swift test
      # The original Fraction(Double) recursion crash only reproduced in
      # optimized builds, so the release run is not optional.
      - name: Run tests (release)
        run: swift test -c release
